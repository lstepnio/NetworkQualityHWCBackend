name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify contract pin is on an exact tag
        # Both consumers (backend + android) must pin contract/ to a clean
        # tag — never a SHA past a tag. Drift here causes silent wire-format
        # disagreements at runtime (JSON deserializers ignore unknown fields).
        run: |
          PIN=$(git -C contract describe --tags --exact-match 2>/dev/null) || {
            echo "::error::contract submodule is not at an exact tag"
            echo "current: $(git -C contract describe --tags --always)"
            exit 1
          }
          echo "Contract pinned at: $PIN"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1
