services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certifier
      POSTGRES_USER: certifier
      POSTGRES_PASSWORD: certifier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certifier -d certifier"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    # Pinned to a published release. Bump this tag (or swap to `build:` for
    # an iteration loop) and `docker compose up -d` to roll forward.
    image: ghcr.io/lstepnio/networkqualityhwcbackend:0.7.10
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://certifier:certifier@postgres:5432/certifier?sslmode=disable
      HTTP_ADDR: ":8080"
      # APP_ENV=dev tolerates the dev defaults below. Anything else
      # (prod, staging, preview, …) trips the fail-fast guard in
      # internal/config/env.go::validateProductionSafety and refuses
      # to boot.
      APP_ENV: dev
      DEV_SEED: "1"
      PII_PEPPER: dev-pepper-change-me
      ADMIN_TOKEN: dev-admin-token-change-me
      # Shared secret for HMAC-SHA256 auth on /v1/*. Empty disables
      # verification entirely (legacy-passthrough); non-empty enables
      # observe-then-opt-in. V1_HMAC_REQUIRE=true makes it mandatory.
      V1_HMAC_SECRET: dev-hmac-secret-change-me
    ports:
      - "8080:8080"

volumes:
  pgdata:
